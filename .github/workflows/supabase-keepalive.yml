name: Keep Supabase awake

# Supabase's free tier pauses a project after about a week with no activity.
# When that happens every photo, booking, price, and the admin login go dark.
# This runs one tiny database query a day so the project never looks idle.
#
# It doubles as an outage alarm: if the database doesn't answer, the run fails
# and GitHub emails the repo owner.

on:
  schedule:
    - cron: '17 9 * * *'   # daily at 09:17 UTC (off the hour, when GitHub is less busy)
  workflow_dispatch:        # adds a "Run workflow" button for manual checks

permissions:
  actions: write            # lets the second step keep this schedule switched on
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are missing"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            "$SUPABASE_URL/rest/v1/portfolio_photos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Database answered — project is awake."

      - name: Keep this schedule from being switched off
        # GitHub disables scheduled workflows in public repos after 60 days
        # without a commit — which would quietly bring the pausing problem back.
        # Re-enabling through the API is the standard way to prevent that
        # without dummy commits (a commit would trigger a site rebuild).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
